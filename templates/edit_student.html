{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}


{% block content %}

    <h1>Edit Student</h1>


    <form method="POST">


        <label>ID</label>

        <input
            type="number"
            value="{{ student.user_id }}"
            disabled
        >
        <!-- disabled = пользователь не может изменить ID -->


        <label>First name</label>

        <input
            type="text"
            name="first_name"
            value="{{ student.first_name }}"
            required
        >


        <label>Last name</label>

        <input
            type="text"
            name="last_name"
            value="{{ student.last_name }}"
            required
        >


        <label>Age</label>

        <input
            type="number"
            name="age"
            value="{{ student.age }}"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ student.email }}"
            required
        >


        <label>Faculty</label>

        <input
            type="text"
            name="faculty"
            value="{{ student.faculty }}"
            required
        >


        <label>Course</label>

        <input
            type="number"
            name="course"
            value="{{ student.course }}"
            required
        >


        <label>GPA</label>

        <input
            type="number"
            step="0.1"
            name="gpa"
            value="{{ student.gpa }}"
            required
        >


        <button type="submit">
            Save Changes
        </button>


    </form>

{% endblock %}
